<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f6f8fb"/><text x="44" y="54" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14213d">RSVP Reader — wiring from IMG_0670</text><text x="44" y="86" font-family="Arial,sans-serif" font-size="16" fill="#52627a">GPIO and OLED connections transcribed from the supplied schematic.</text><rect x="395" y="140" width="360" height="470" rx="22" fill="#176b5b"/><text x="575" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Raspberry Pi Pico</text><g font-family="Arial,sans-serif" font-size="18" fill="white"><text x="430" y="235">3V3(OUT)</text><text x="430" y="275">GND</text><text x="430" y="315">GP5 / SCL</text><text x="430" y="355">GP4 / SDA</text><text x="430" y="415">GP10</text><text x="430" y="455">GND</text><text x="430" y="495">GP12</text><text x="430" y="555">VBUS (pin 40)</text><text x="430" y="590">GND</text></g><rect x="865" y="195" width="270" height="190" rx="16" fill="white" stroke="#f59e0b" stroke-width="3"/><text x="1000" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14213d">OLED display</text><g font-family="Arial,sans-serif" font-size="18" fill="#14213d"><text x="890" y="272">VCC</text><text x="890" y="307">GND</text><text x="890" y="342">SCK / SCL</text><text x="890" y="377">SDA</text></g><path d="M755 230H850 M755 270H850 M755 310H850 M755 350H850" stroke="#d97706" stroke-width="4"/><text x="786" y="219" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">3V3</text><text x="786" y="260" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">GND</text><text x="786" y="300" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">GP5</text><text x="786" y="340" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">GP4</text><rect x="55" y="385" width="260" height="155" rx="16" fill="white" stroke="#3b82f6" stroke-width="3"/><text x="185" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14213d">Buttons (active low)</text><text x="80" y="462" font-family="Arial,sans-serif" font-size="17" fill="#14213d">GP10 — Menu — GND</text><text x="80" y="500" font-family="Arial,sans-serif" font-size="17" fill="#14213d">GP12 — Select — GND</text><path d="M315 430H395 M315 490H395" stroke="#2563eb" stroke-width="4"/><rect x="830" y="450" width="305" height="190" rx="16" fill="white" stroke="#dc2626" stroke-width="3"/><text x="982" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14213d">TP4056 + LiPo</text><text x="850" y="525" font-family="Arial,sans-serif" font-size="17" fill="#14213d">OUT+ → switch → Pico VBUS</text><text x="850" y="560" font-family="Arial,sans-serif" font-size="17" fill="#14213d">OUT− → Pico GND</text><text x="850" y="595" font-family="Arial,sans-serif" font-size="17" fill="#14213d">B+ / B− → LiPo + / −</text><path d="M755 555H805V515H830 M755 590H805V555H830" fill="none" stroke="#dc2626" stroke-width="4"/><rect x="45" y="650" width="1090" height="74" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="66" y="679" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9a3412">Power note:</text><text x="166" y="679" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12">The sketch routes charger OUT+ to VBUS as drawn. Pico VBUS is the USB 5 V rail;</text><text x="66" y="706" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12">confirm USB backfeed isolation before connecting USB while battery power is attached. Consider verifying whether VSYS was intended.</text></svg>